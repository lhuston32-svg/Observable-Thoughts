<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | Observable Thoughts</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Allura&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="assets/css/styles.css">

</head>

<body>

<header class="header">

    <h1>Observable Thoughts</h1>

</header>

<section class="hero-banner">

    <a href="index.html">

        <img
            src="assets/images/hero/hero.jpg"
            alt="Return to the Observable Thoughts home page">

    </a>

</section>

<div class="page-container">

    <main>

        <section class="shopping-cart">

            <h2>Shopping Cart</h2>

            <div id="cart-items">

                <!-- JavaScript will create the cart here -->

            </div>

            <section class="cart-summary">

                <h3>Order Summary</h3>

                <p>
                    Subtotal:
                    <span id="cart-subtotal">
                        A$0.00
                    </span>
                </p>

                <p>
                    Shipping:
                    Calculated at Checkout
                </p>

                <h3>
                    Total:
                    <span id="cart-total">
                        A$0.00
                    </span>
                </h3>

                <button
                    id="checkout-button"
                    class="product-enquiry-button">

                    Proceed to Checkout

                </button>

            </section>

        </section>

    </main>

</div>

<script src="assets/js/script.js"></script>

</body>

</html>
